name: evaluacion-edwin-zamora

services:
  mysql:
    build:
      context: ./EvaluacionEdwinZamora-database
    image: evaluacion-edwin-zamora-mysql:1.0.0
    container_name: evaluacion-edwin-zamora-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-transferencias}
      MYSQL_USER: ${MYSQL_USER:-transferencias}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-transferencias}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [tms]

  backend:
    build:
      context: ./EvaluacionEdwinZamora-backend
      args:
        FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
    image: evaluacion-edwin-zamora-backend:1.0.0
    container_name: evaluacion-edwin-zamora-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-transferencias}?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-transferencias}
      DB_PASSWORD: ${MYSQL_PASSWORD:-transferencias}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Guayaquil}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/q/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [tms]

  frontend:
    build:
      context: ./EvaluacionEdwinZamora-frontend
    image: evaluacion-edwin-zamora-frontend:1.0.0
    container_name: evaluacion-edwin-zamora-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-4200}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [tms]

volumes:
  mysql-data:

networks:
  tms:
    driver: bridge
