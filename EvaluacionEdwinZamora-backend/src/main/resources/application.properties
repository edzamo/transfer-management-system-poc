quarkus.application.name=transferencias
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Base de datos (MySQL 8). En test, Dev Services levanta un MySQL real.
quarkus.datasource.db-kind=mysql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3307/transferencias?useSSL=false&allowPublicKeyRetrieval=true}
%prod.quarkus.datasource.username=${DB_USERNAME:transferencias}
%prod.quarkus.datasource.password=${DB_PASSWORD:transferencias}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3307/transferencias?useSSL=false&allowPublicKeyRetrieval=true}
%dev.quarkus.datasource.username=${DB_USERNAME:transferencias}
%dev.quarkus.datasource.password=${DB_PASSWORD:transferencias}
%test.quarkus.datasource.devservices.image-name=mysql:8.0
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.flyway.migrate-at-start=true
# Espera máxima por un bloqueo de fila (InnoDB); al vencer se traduce a 409 CUENTA_BLOQUEADA
quarkus.datasource.jdbc.additional-jdbc-properties.sessionVariables=innodb_lock_wait_timeout=${DB_LOCK_WAIT_SECONDS:5}

# Negocio
app.timezone=${APP_TIMEZONE:America/Guayaquil}

# CORS (en docker-compose el proxy de nginx lo hace innecesario)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.info-title=Transferencias Interbancarias API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Gestión de cuentas, transferencias, detección de operaciones sospechosas e historial.
# Intencional: el reto exige Swagger UI accesible también en el perfil prod; no deshabilitar.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Logs
quarkus.log.level=INFO
quarkus.log.category."com.netby.transferencias".level=INFO
